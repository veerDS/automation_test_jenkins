name: Automated API tests using Postman CLI

on: workflow_dispatch 
#on:
#  schedule:
#    - cron: "0 9 * * *"     
jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
          
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      
      - name: Install Newman
        run: npm install -g newman  
      
      - name: Run API tests
        id: postman_tests
        continue-on-error: true
        run: |
          newman run "32728476-b018df59-1211-4501-a204-a08f64ee2e53" \
            -r html,json \
            --reporter-html-export results/report.html

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-reports
          path: results/report.html

      - name: Generate Summary Table
        if: always()
        run: |
          echo "### 📊 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status | Environment |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: |" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.postman_tests.outcome }}" = "success" ]; then
            echo "| **Postman API Collection** | ✅ Passed | TEST |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **Postman API Collection** | ❌ Failed | TEST |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Report Final Status
        run: exit 1
        if: steps.postman_tests.outcome == 'failure'
